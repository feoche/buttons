<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, user-scalable=no" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/img/favicon.png" />
    <link href="/img/favicon.png" rel="apple-touch-icon" />
    <link href="/img/favicon.png" rel="apple-touch-icon" sizes="152x152" />
    <link href="/img/favicon.png" rel="apple-touch-icon" sizes="167x167" />
    <link href="/img/favicon.png" rel="apple-touch-icon" sizes="180x180" />
    <title>Buttons</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js", { scope: "/" })
          .then((reg) => {
            console.log("[SW] Registered, scope:", reg.scope);
            // When a new SW is waiting, reload once it takes control
            reg.addEventListener("updatefound", () => {
              const next = reg.installing;
              if (!next) return;
              next.addEventListener("statechange", () => {
                if (next.state === "installed" && navigator.serviceWorker.controller) {
                  // New content available — post message so app can show a toast
                  navigator.serviceWorker.controller.postMessage({ type: "SW_UPDATED" });
                }
              });
            });
          })
          .catch((err) => console.warn("[SW] Registration failed:", err));
      }
    </script>
  </body>
</html>
